name: Slow Review Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 故意不设置 concurrency 和 timeout（复现问题）

jobs:
  slow-review:
    runs-on: ubuntu-latest
    # 故意不设置 timeout-minutes

    steps:
      - name: Simulate slow process (3 min)
        run: |
          echo "Starting slow review..."
          sleep 180  # 模拟3分钟的处理时间
          echo "Review complete"