name: Slow Review Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      pr_url:
        required: true
        type: string

# 故意不设置 concurrency 和 timeout（复现问题）

jobs:
  slow-review:
    runs-on: ubuntu-latest
    # 故意不设置 timeout-minutes
    # timeout-minutes: 1
    # continue-on-error: true

    steps:
      - name: Simulate slow process (1 min)
        run: |
          echo "Starting slow review..."
          sleep 300  # 模拟3分钟的处理时间
          echo "Review complete"