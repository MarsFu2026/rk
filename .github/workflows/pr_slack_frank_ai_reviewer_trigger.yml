name: PR Slack FrankAI Reviewer Trigger

on:
  workflow_call:
    inputs:
      pr_url:
        required: true
        type: string

jobs:
  notify-frank-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_URL: ${{ inputs.pr_url }}
          FRANK_AI_MENTION: ${{ secrets.FRANK_AI_MENTION }}
        run: python pr_slack_frank_ai_reviewer_trigger.py
