name: Design Doc Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  design-doc-review:
    runs-on: ubuntu-latest
    # runs-on: self-hosted
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai requests

      - name: Run Design Doc Review Agent
        env:
          MY_MODELS_TOKEN: ${{ secrets.MY_MODELS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Defaults to current repo; override by setting vars.TARGET_REPO in repo settings
          REPO_FULL_NAME: ${{ vars.TARGET_REPO || github.repository }}
          # Set vars.SCORE_THRESHOLD in repo settings (Settings → Secrets and variables → Variables)
          SCORE_THRESHOLD: ${{ vars.SCORE_THRESHOLD || '7' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_ACTION: ${{ github.event.action }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_REVIEWERS: ${{ join(github.event.pull_request.requested_reviewers.*.login, ',') }}
        run: python agent/review.py
